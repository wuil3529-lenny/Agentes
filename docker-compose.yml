# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Tripulación IA
#
# Uso rápido:
#   docker compose up --build          ← Primera vez (construye la imagen)
#   docker compose up                  ← Arranques posteriores
#   docker compose down                ← Detener y limpiar
#   docker compose logs -f             ← Ver logs en tiempo real
# ─────────────────────────────────────────────────────────────────────────────

services:

  tripulacion_ia:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tripulacion_ia_v3

    # ── Archivo de entorno ─────────────────────────────────────────────────
    # Carga todas las variables del .env de Windows (API keys, tokens, etc.)
    # El archivo .env NO se copia dentro de la imagen; se lee en tiempo de ejecución.
    env_file:
      - .env

    # ── Variables de entorno adicionales del contenedor ───────────────────
    # Sobreescriben los valores hardcodeados de Windows en los scripts Python.
    # Los scripts usan os.getenv() con fallback, así que esto es suficiente.
    environment:
      # Rutas internas del contenedor (reemplazan las rutas C:\Users\... de Windows)
      - AGENTES_ROOT=/app
      - SHARED_MEMORY_PATH=/app/memoria_compartida

      # URL de n8n corriendo nativo en Windows (accesible desde el contenedor vía host.docker.internal)
      - N8N_BASE_URL=http://host.docker.internal:5678

      # Ignorar permisos 777 de Windows al montar ~/.n8n
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - PIP_CACHE_DIR=/home/tripulacion/.pip_cache

      # Codificación de salida (equivalente al reconfigure de Windows)
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8

    # ── Puertos ───────────────────────────────────────────────────────────
    # NOTA: n8n y ngrok corren nativamente en Windows.
    # Los puertos 5678 y 4040 ya están ocupados en el host.
    # El contenedor accede a n8n vía host.docker.internal:5678.
    # ports:
      # - "5678:5678"   # n8n Web UI (desactivado: corre nativo en Windows)
      # - "4040:4040"   # ngrok API (desactivado: corre nativo en Windows)

    # ── Volúmenes — Bind Mount bidireccional ──────────────────────────────
    # CRÍTICO: Todo lo que el agente escribe en /app se guarda al instante
    # en el disco de Windows. Los cambios van en ambas direcciones.
    volumes:
      # Carpeta raíz de Agentes → raíz del contenedor
      - type: bind
        source: .
        target: /app

      # Mapear la base de datos local de n8n de Windows al contenedor
      # para NO perder los flujos existentes.
      - ~/.n8n:/home/tripulacion/.n8n

      # Cache de pip persistente (acelera reinicios sin reconstruir imagen)
      - pip_cache:/home/tripulacion/.pip_cache

    # ── Red — Acceso al host Windows ──────────────────────────────────────
    # host.docker.internal resuelve a la IP de la máquina Windows.
    # Permite que Zoro llame a http://host.docker.internal:5678 (n8n)
    # y que cualquier agente acceda a servicios locales de Windows.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ── Comando de inicio ─────────────────────────────────────────────────
    # Ejecuta el script start.sh que lanza base_listener.py + telegram_bridge.py
    # en paralelo y mantiene el contenedor vivo.
    command: ["/bin/bash", "/app/start.sh"]

    # ── Política de reinicio ───────────────────────────────────────────────
    # unless-stopped: se reinicia automáticamente si el contenedor crashea,
    # pero NO al hacer "docker compose down" intencionalmente.
    restart: unless-stopped

    # ── Health Check ──────────────────────────────────────────────────────
    # Verifica cada 60s que el proceso base_listener sigue vivo.
    # Si falla 3 veces consecutivas, Docker marca el contenedor como "unhealthy".
    healthcheck:
      test: ["CMD", "pgrep", "-f", "base_listener.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    # ── Límites de recursos (opcional, comentar si la máquina es potente) ──
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2g
    #       cpus: "2.0"

# ── Volúmenes nombrados ────────────────────────────────────────────────────────
volumes:
  pip_cache:
    driver: local
